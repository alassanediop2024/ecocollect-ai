<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">EC</div>

      <div>
        <h1>EcoCollect AI</h1>
        <span>Gestion municipale</span>
      </div>
    </div>

    <nav class="navigation">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">▦</span>
        Tableau de bord
      </a>

      <a
        routerLink="/containers"
        routerLinkActive="active">
        <span class="nav-icon">▣</span>
        Contenants
      </a>

      <a
        routerLink="/collections"
        routerLinkActive="active">
        <span class="nav-icon">↻</span>
        Collectes
      </a>

      <a
        routerLink="/anomalies"
        routerLinkActive="active">
        <span class="nav-icon">!</span>
        Anomalies
      </a>

      <a
        routerLink="/sectors"
        routerLinkActive="active">
        <span class="nav-icon">⌖</span>
        Secteurs
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="status-dot"></span>
      API EcoCollect
    </div>
  </aside>

  <div class="content-wrapper">

    <header class="topbar">
      <div>
        <span class="environment">Plateforme municipale</span>
      </div>

      <div class="topbar-right">
        <span class="api-status">
          <span class="status-dot"></span>
          Système opérationnel
        </span>

        <div class="user-avatar">
          AD
        </div>
      </div>
    </header>

    <main class="main-content">
      <router-outlet />
    </main>

    <footer class="app-footer">
      <span>
        © 2026
        <a
          class="hybridelab-link"
          href="https://www.hybridelab.com/"
          target="_blank"
          rel="noopener noreferrer">
          HybrideLab
        </a>
      </span>

      <span class="footer-separator">—</span>
      <span>Développement d'applications web et mobiles</span>
      <span class="footer-dot">·</span>
      <span>Formation</span>
      <span class="footer-dot">·</span>
      <span>Infonuagique</span>
      <span class="footer-dot">·</span>
      <span>Cybersécurité</span>
      <span class="footer-dot">·</span>
      <span>Édition numérique</span>
    </footer>

  </div>

</div>
