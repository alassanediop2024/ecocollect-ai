spring:
  application:
    name: ecocollect-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecocollect}
    username: ${DB_USERNAME:ecocollect}
    password: ${DB_PASSWORD:ecocollect_dev}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
