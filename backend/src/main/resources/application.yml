spring:
  application:
    name: ecocollect-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecocollect}
    username: ${DB_USERNAME:ecocollect}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
